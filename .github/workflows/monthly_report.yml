name: "Monthly contributors' report"
on:
  workflow_dispatch:
  schedule:
    - cron: "3 2 1 * *"

permissions:
  contents: read

jobs:
  contributor_report:
    name: "Generate contributors' report"
    runs-on: ubuntu-latest
    env:
      OUTPUT_FILENAME: contributors.md

    steps:
      - name: Get dates for last month
        shell: bash
        run: |
          # Calculate the first day of the previous month
          start_date=$(date -d "last month" +%Y-%m-01)

          # Calculate the last day of the previous month
          end_date=$(date -d "$start_date +1 month -1 day" +%Y-%m-%d)

          # Set an environment variable with the date range
          echo "START_DATE=$start_date" >> "$GITHUB_ENV"
          echo "END_DATE=$end_date" >> "$GITHUB_ENV"

      - name: Run contributor action
        uses: github-community-projects/contributors@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          START_DATE: ${{ env.START_DATE }}
          END_DATE: ${{ env.END_DATE }}
          ORGANIZATION: "Yunohost-Apps"
          SPONSOR_INFO: "false"

      - name: Sort table by number of contributions (top to bottom)
        shell: bash
        run: |
          # Required for some reason to allow editing ${{ env.OUTPUT_FILENAME }} - cf. https://github.com/actions/checkout/issues/211
          sudo chown -R $USER:$USER "$GITHUB_WORKSPACE"

          # Extract main data table
          file="${{ env.OUTPUT_FILENAME }}"
          tmp="$(mktemp)"
          (head -n 11 "$file" | tail -n +10 && tail -n +12 "$file" | head -n -2) > "$tmp"
          mv "$tmp" "$file"

          # Sort it by second column (contributions count)
          cat $file | sort --field-separator=\| --key=3 --general-numeric-sort --reverse > "$tmp"
          mv "$tmp" "$file"

          # Add title
          sed -i "1s/^/# YunoHost-Apps contributors ${{ env.START_DATE }} to ${{ env.END_DATE }} t\n/" "$file"

          # Update Github Actions Job Summary with new content
          cat "$file" > "$GITHUB_STEP_SUMMARY"
